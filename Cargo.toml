[package]
name = "greep"
version = "0.1.0"
edition = "2021"
license = "MIT"
# Driven by the dependency tree, not by this crate's own source: clap 4.x and
# assert_cmd both declare 1.85. Declared here so a dependency raising its floor
# surfaces as a build error rather than silently drifting from the README.
rust-version = "1.85"

[[bin]]
name = "greep"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

# Declared here rather than as CI-only flags so `cargo clippy` locally and in CI
# apply the same policy. `priority = -1` lets individual lints below override the
# group; add opt-outs here as they actually come up, not pre-emptively.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
